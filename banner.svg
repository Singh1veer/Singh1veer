<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Harshveer Singh - Full-stack developer and DSA enthusiast, Computer Engineering at Thapar Institute" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#dots)"/>

    <!-- ===== Graph (right): Dijkstra finds the shortest path A -> G ===== -->
    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12">
      <!-- all edges -->
      <g stroke="#2b3d63" stroke-width="2" stroke-linecap="round">
        <line x1="590" y1="210" x2="650" y2="100"/>
        <line x1="590" y1="210" x2="710" y2="240"/>
        <line x1="650" y1="100" x2="790" y2="65"/>
        <line x1="650" y1="100" x2="800" y2="160"/>
        <line x1="710" y1="240" x2="800" y2="160"/>
        <line x1="710" y1="240" x2="880" y2="255"/>
        <line x1="790" y1="65" x2="930" y2="120"/>
        <line x1="800" y1="160" x2="930" y2="120"/>
        <line x1="800" y1="160" x2="880" y2="255"/>
      </g>
      <!-- edge weights -->
      <g fill="#7f93bd" text-anchor="middle">
        <text x="612" y="148">4</text>
        <text x="640" y="236">2</text>
        <text x="720" y="72">5</text>
        <text x="718" y="122">3</text>
        <text x="741" y="204">6</text>
        <text x="798" y="258">7</text>
        <text x="870" y="86">3</text>
        <text x="870" y="150">2</text>
        <text x="852" y="214">4</text>
      </g>

      <!-- shortest path: draws itself, then resets -->
      <path d="M590 210 L650 100 L800 160 L930 120" pathLength="100" fill="none"
            stroke="url(#path)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="100" stroke-dashoffset="100" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.5;0.88;1" dur="6s" repeatCount="indefinite"/>
      </path>

      <!-- travelling packet -->
      <circle r="6" fill="#ffffff" filter="url(#glow)" opacity="0">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.5;1"
                       path="M590 210 L650 100 L800 160 L930 120"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.5;0.52;1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- nodes -->
      <g stroke-width="2.5">
        <circle cx="590" cy="210" r="11" fill="#0a1222" stroke="#5eead4"/>
        <circle cx="650" cy="100" r="9" fill="#0a1222" stroke="#6b82b0"/>
        <circle cx="710" cy="240" r="9" fill="#0a1222" stroke="#6b82b0"/>
        <circle cx="790" cy="65" r="9" fill="#0a1222" stroke="#6b82b0"/>
        <circle cx="800" cy="160" r="9" fill="#0a1222" stroke="#6b82b0"/>
        <circle cx="880" cy="255" r="9" fill="#0a1222" stroke="#6b82b0"/>
        <circle cx="930" cy="120" r="11" fill="#0a1222" stroke="#fbbf24"/>
      </g>
      <g fill="#e2e8f0" text-anchor="middle" font-weight="700">
        <text x="590" y="214">A</text>
        <text x="930" y="124">G</text>
      </g>

      <!-- result label -->
      <text x="930" y="152" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700" opacity="0">
        dist = 9
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.88;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- ===== Text (left) ===== -->
    <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
      <text x="48" y="104" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">
        Harshveer Singh
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
      </text>
      <rect x="50" y="122" width="0" height="4" rx="2" fill="url(#path)">
        <animate attributeName="width" from="0" to="150" dur="0.8s" begin="0.5s" fill="freeze"/>
      </rect>
      <text x="50" y="158" font-size="18" fill="#cbd5e1" opacity="0">
        Computer Engineering at Thapar Institute, 2024 to 2028
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.9s" fill="freeze"/>
      </text>
    </g>

    <!-- cycling roles -->
    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#e2e8f0">
      <text x="50" y="194" opacity="0"><tspan fill="#5eead4">&gt; </tspan>full-stack developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="50" y="194" opacity="0"><tspan fill="#fbbf24">&gt; </tspan>graph algorithms, 450+ problems solved
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="50" y="194" opacity="0"><tspan fill="#5eead4">&gt; </tspan>building things people actually use
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.96;1" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- numbers -->
    <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.2s" fill="freeze"/>
        <text x="50" y="254" font-size="28" font-weight="800" fill="#f8fafc">800+</text>
        <text x="50" y="274" font-size="13" fill="#94a3b8">students reached</text>
        <text x="200" y="254" font-size="28" font-weight="800" fill="#f8fafc">604</text>
        <text x="200" y="274" font-size="13" fill="#94a3b8">faculty profiles live</text>
        <text x="360" y="254" font-size="28" font-weight="800" fill="#f8fafc">15+</text>
        <text x="360" y="274" font-size="13" fill="#94a3b8">REST APIs shipped</text>
      </g>
    </g>
  </g>

  <!-- soft border with a light that travels around the edge -->
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="url(#path)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="12 88">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>